<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Level Editor - Particle Organisms</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161820'/%3E%3Cpath d='M16 44 44 16M20 16h28v28' fill='none' stroke='%237c6af7' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='44' r='7' fill='%2382e6f5'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0e0f14; --surface:#161820; --surface2:#1e2030; --border:#2a2d3e; --accent:#7c6af7;
    --text:#cdd6f4; --muted:#6c7086; --danger:#f38ba8; --success:#a6e3a1; --warning:#f9c74f; --info:#82e6f5;
  }
  body { font-family:'JetBrains Mono', monospace; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  #topbar { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
  #topbar h1 { font-family:'Syne', sans-serif; font-weight:800; font-size:15px; letter-spacing:.04em; color:var(--accent); margin-right:10px; }
  .btn { font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:600; padding:5px 12px; border-radius:5px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer; transition:all .15s; letter-spacing:.03em; }
  .btn:hover { background:var(--border); border-color:var(--accent); }
  .btn.danger { border-color:var(--danger); color:var(--danger); }
  .btn.danger:hover { background:rgba(243,139,168,.12); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { background:#9580ff; }
  .btn.info { border-color:rgba(130,230,245,.45); color:var(--info); }
  .btn.info:hover { background:rgba(130,230,245,.08); }
  #project-display { font-size:10px; color:var(--info); opacity:.85; margin-left:8px; white-space:nowrap; }
  #status-display { font-size:10px; color:var(--success); opacity:.9; white-space:nowrap; min-height:12px; }
  #coord-display { margin-left:auto; font-size:11px; color:var(--muted); min-width:220px; text-align:right; }
  #main { display:grid; grid-template-columns:minmax(0, 1fr) 340px; column-gap:16px; flex:1; overflow:hidden; background:var(--bg); }
  #workspace { min-width:0; position:relative; overflow:hidden; display:flex; }
  #toolbar { width:72px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:6px; flex-shrink:0; overflow-y:auto; }
  .tool-label { font-size:8px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:6px; }
  .entity-btn { width:48px; height:48px; border-radius:10px; border:2px solid var(--border); background:var(--surface2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; position:relative; }
  .entity-btn:hover { border-color:var(--accent); transform:scale(1.05); }
  .entity-btn.active { border-color:var(--accent); background:rgba(124,106,247,.18); box-shadow:0 0 12px rgba(124,106,247,.3); }
  .entity-btn canvas { border-radius:50%; }
  .entity-btn span { position:absolute; bottom:-16px; font-size:7px; color:var(--muted); letter-spacing:.05em; white-space:nowrap; }
  .entity-btn .kbd { position:absolute; top:2px; right:2px; font-size:7px; font-weight:700; color:rgba(124,106,247,.7); background:rgba(124,106,247,.12); border:1px solid rgba(124,106,247,.25); border-radius:3px; padding:0 3px; line-height:1.6; letter-spacing:0; pointer-events:none; }
  .tool-mini-btn { width:48px; min-height:32px; border-radius:8px; border:2px solid var(--border); background:var(--surface2); color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:8px; font-weight:700; letter-spacing:.04em; text-align:center; cursor:pointer; transition:all .15s; line-height:1.25; user-select:none; display:flex; align-items:center; justify-content:center; padding:4px 2px; }
  .tool-mini-btn:hover { border-color:var(--accent); color:var(--text); }
  .tool-mini-btn.on { border-color:var(--warning); color:var(--warning); background:rgba(255,200,60,.12); box-shadow:0 0 10px rgba(255,200,60,.22); }
  .pz-toggle { display:flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .pz-toggle button { flex:1; font-family:'JetBrains Mono', monospace; font-size:10px; padding:4px 0; border:none; background:var(--surface2); color:var(--muted); cursor:pointer; transition:all .15s; }
  .pz-toggle button.on { background:rgba(60,200,80,.22); color:var(--success); font-weight:600; }
  #rand-toggle { width:48px; padding:5px 0; border-radius:8px; border:2px solid rgba(255,200,60,.3); background:var(--surface2); color:rgba(255,200,60,.6); font-family:'JetBrains Mono', monospace; font-size:8px; font-weight:700; letter-spacing:.04em; text-align:center; cursor:pointer; transition:all .15s; line-height:1.4; user-select:none; }
  #rand-toggle:hover { border-color:rgba(255,200,60,.7); background:rgba(255,200,60,.08); }
  #rand-toggle.on { border-color:#f9c74f; background:rgba(255,200,60,.18); color:#f9c74f; box-shadow:0 0 10px rgba(255,200,60,.25); }
  .rand-inputs { display:flex; flex-direction:column; gap:3px; width:52px; padding:0 2px; }
  .rand-inputs label { font-size:7px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; }
  .rand-inputs input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:3px; color:#f9c74f; font-family:'JetBrains Mono', monospace; font-size:10px; padding:2px 4px; outline:none; text-align:center; }
  .rand-inputs input:focus { border-color:#f9c74f; }
  #index-picker { display:none; flex-direction:column; align-items:center; gap:3px; width:52px; }
  #index-picker-label { font-size:7px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; }
  #index-picker-controls { display:flex; align-items:center; gap:2px; width:52px; }
  .idx-arrow { width:16px; height:22px; border-radius:3px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:11px; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .1s; user-select:none; flex-shrink:0; padding:0; }
  .idx-arrow:hover { background:var(--border); }
  #index-picker-val { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:3px; color:var(--accent); font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; padding:2px 0; outline:none; text-align:center; width:0; min-width:0; }
  #index-picker-val:focus { border-color:var(--accent); }
  .tool-sep { width:40px; height:1px; background:var(--border); margin:6px 0; }
  #canvas-wrap { flex:1; min-width:0; position:relative; overflow:hidden; background:radial-gradient(ellipse at 30% 20%, rgba(124,106,247,.04) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(170,80,255,.03) 0%, transparent 55%), #0e0f14; }
  #canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #props-panel { width:340px; min-width:340px; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
  #props-panel h2 { font-family:'Syne', sans-serif; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:12px 14px 8px; border-bottom:1px solid var(--border); }
  .prop-empty { padding:20px 14px; font-size:11px; color:var(--muted); line-height:1.6; }
  .prop-row { padding:8px 14px; border-bottom:1px solid rgba(42,45,62,.5); }
  .prop-row label { display:block; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .prop-row input[type="text"], .prop-row input[type="number"], .prop-row select { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:'JetBrains Mono', monospace; font-size:11px; padding:5px 8px; outline:none; transition:border-color .15s; }
  .prop-row input:focus, .prop-row select:focus { border-color:var(--accent); }
  .prop-slider { display:grid; grid-template-columns:minmax(0, 1fr) 72px; gap:10px; align-items:center; }
  .prop-slider input[type="number"].prop-slider-number { width:72px; text-align:center; padding:5px 6px; }
  .prop-slider input[type="number"].prop-slider-number::-webkit-outer-spin-button,
  .prop-slider input[type="number"].prop-slider-number::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .prop-slider input[type="number"].prop-slider-number { -moz-appearance:textfield; appearance:textfield; }
  .prop-range {
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    height:10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
    background:
      linear-gradient(90deg, #66ebda 0%, #66ebda var(--range-pct, 50%), rgba(255,255,255,.14) var(--range-pct, 50%), rgba(255,255,255,.14) 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
    cursor:pointer;
    padding:0;
  }
  .prop-range::-webkit-slider-thumb {
    -webkit-appearance:none;
    appearance:none;
    width:22px;
    height:22px;
    border-radius:50%;
    border:none;
    background:#66ebda;
    box-shadow:0 0 0 3px rgba(102,235,218,.18), 0 3px 10px rgba(0,0,0,.3);
  }
  .prop-range::-moz-range-thumb {
    width:22px;
    height:22px;
    border-radius:50%;
    border:none;
    background:#66ebda;
    box-shadow:0 0 0 3px rgba(102,235,218,.18), 0 3px 10px rgba(0,0,0,.3);
  }
  .prop-range::-moz-range-track {
    height:10px;
    border:none;
    border-radius:999px;
    background:transparent;
  }
  .prop-bool-toggle { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; }
  .prop-bool-btn {
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--surface2);
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:.04em;
    padding:7px 10px;
    cursor:pointer;
    transition:all .15s;
  }
  .prop-bool-btn:hover { border-color:#66ebda; color:var(--text); }
  .prop-bool-btn.on {
    border-color:#66ebda;
    background:rgba(102,235,218,.14);
    color:#66ebda;
    box-shadow:0 0 0 1px rgba(102,235,218,.12) inset;
  }
  .circle-section-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px 8px;
    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(130,230,245,.85);
    border-bottom:1px solid rgba(60,190,210,.25);
    margin-top:4px;
    cursor:pointer;
    user-select:none;
    transition:background .15s ease, color .15s ease;
  }
  .circle-section-header:hover { background:rgba(130,230,245,.06); color:#9bf1ff; }
  .circle-section-header::after {
    content:'▾';
    font-size:11px;
    color:rgba(130,230,245,.7);
    transform-origin:center;
    transition:transform .15s ease, color .15s ease;
  }
  .circle-section-header.collapsed::after { transform:rotate(-90deg); color:rgba(130,230,245,.45); }
  .circle-section-content { overflow:hidden; }
  .circle-section-content.collapsed { display:none; }
  .circle-row-header { padding:5px 14px 2px; font-size:9px; letter-spacing:.07em; color:rgba(130,230,245,.65); font-weight:600; }
  #modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:100; align-items:center; justify-content:center; }
  #modal-overlay.open { display:flex; }
  #modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:560px; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 24px 80px rgba(0,0,0,.6); }
  #modal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
  #modal-header h3 { font-family:'Syne', sans-serif; font-size:14px; font-weight:700; }
  #modal-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; }
  #modal-close:hover { color:var(--text); }
  #modal-body { padding:14px 18px; flex:1; overflow:auto; }
  #modal-body textarea { width:100%; height:320px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--success); font-family:'JetBrains Mono', monospace; font-size:11px; padding:12px; resize:none; outline:none; line-height:1.5; }
  #modal-footer { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--border); }
  #sprite-cal-modal { position:absolute; left:120px; top:120px; background:rgba(10,14,20,.36); border:1px solid rgba(130,230,245,.18); border-radius:12px; width:min(1100px,94vw); height:min(760px,90vh); display:flex; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,.32); backdrop-filter:blur(3px); }
  #sprite-cal-canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center; background:transparent; }
  #sprite-cal-canvas { border:1px dashed rgba(130,230,245,.22); background:transparent; max-width:100%; max-height:100%; }
  #sprite-cal-panel { width:340px; border-left:1px solid rgba(130,230,245,.12); background:rgba(12,16,24,.72); display:flex; flex-direction:column; overflow:auto; }
  #sprite-cal-header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid rgba(130,230,245,.12); cursor:move; user-select:none; }
  #sprite-cal-header h3 { font-family:'Syne', sans-serif; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--info); }
  #sprite-cal-body { padding:12px 14px 16px; display:flex; flex-direction:column; gap:10px; }
  .sprite-cal-section { display:flex; flex-direction:column; gap:8px; padding:10px; border:1px solid rgba(255,255,255,.05); border-radius:10px; background:rgba(255,255,255,.02); }
  .sprite-cal-section-title { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .sprite-cal-row { display:grid; grid-template-columns: 110px 1fr 48px; gap:8px; align-items:center; font-size:11px; }
  .sprite-cal-row label { color:#b8c2d8; }
  .sprite-cal-row input[type=range] { width:100%; }
  .sprite-cal-row .val { text-align:right; color:var(--warning); font-size:10px; }
  .sprite-cal-actions { display:flex; gap:8px; flex-wrap:wrap; }
  #sprite-cal-output { background:rgba(10,13,19,.78); border:1px solid var(--border); border-radius:8px; padding:10px; white-space:pre-wrap; font-size:11px; color:var(--success); line-height:1.5; }
  #stentor-panel { position:absolute; top:0; left:72px; bottom:0; width:0; overflow:hidden; background:rgba(22,24,32,.94); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:width .2s cubic-bezier(.4,0,.2,1); z-index:20; box-shadow:18px 0 40px rgba(0,0,0,.28); backdrop-filter:blur(6px); }
  #stentor-panel.open { width:176px; }
  #stentor-panel-inner { width:176px; display:flex; flex-direction:column; height:100%; overflow:hidden; }
  #stentor-panel-head { display:flex; align-items:center; justify-content:space-between; padding:10px 12px 8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  #stentor-panel-head span { font-family:'Syne', sans-serif; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#82e6f5; }
  #stentor-panel-close { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; line-height:1; padding:0; }
  #stentor-panel-close:hover { color:var(--text); }
  #stentor-preset-list { flex:1; overflow-y:auto; padding:8px 8px 12px; display:flex; flex-direction:column; gap:6px; }
  .stentor-preset-card { border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); cursor:pointer; transition:all .15s; overflow:hidden; user-select:none; }
  .stentor-preset-card:hover { border-color:#82e6f5; background:rgba(130,230,245,.06); }
  .stentor-preset-card.active { border-color:#82e6f5; background:rgba(130,230,245,.12); box-shadow:0 0 10px rgba(130,230,245,.18); }
  .stentor-preset-thumb { display:block; width:100%; height:76px; }
  .stentor-preset-name { font-size:10px; font-weight:600; letter-spacing:.05em; color:var(--text); padding:4px 8px 6px; text-align:center; }
  .stentor-preset-card.active .stentor-preset-name { color:#82e6f5; }
  #stentor-panel-save, #stentor-panel-resave { margin:0 8px 8px; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:600; padding:5px 8px; border-radius:5px; cursor:pointer; transition:all .15s; flex-shrink:0; }
  #stentor-panel-save { border:1px dashed rgba(130,230,245,.35); background:transparent; color:rgba(130,230,245,.6); }
  #stentor-panel-save:hover { border-color:#82e6f5; color:#82e6f5; background:rgba(130,230,245,.08); }
  #stentor-panel-resave { margin-bottom:10px; border:1px solid rgba(130,230,245,.20); background:rgba(130,230,245,.05); color:rgba(130,230,245,.8); }
  #stentor-panel-resave:hover { border-color:#82e6f5; background:rgba(130,230,245,.12); }
</style>
</head>
<body>
<div id="topbar">
  <h1>LEVEL EDITOR</h1>
  <button class="btn" id="btn-import-json">Load Level</button>
  <button class="btn info" id="btn-load-bg">Load PNG Background</button>
  <button class="btn" id="btn-clear-bg">Clear Background</button>
  <button class="btn" id="btn-edit-bg">Edit Background: OFF</button>
  <button class="btn" id="btn-reset-bg">Reset Background Fit</button>
  <button class="btn info" id="btn-pick-folder">Pick Project Folder</button>
  <button class="btn info" id="btn-load-entities">Load Entities</button>
  <button class="btn primary" id="btn-export-json">Save Level</button>
  <button class="btn danger" id="btn-clear-level">Clear</button>
  <div id="project-display">project: none</div>
  <div id="status-display"></div>
  <div id="coord-display">px: -, - &nbsp;|&nbsp; norm: -, -</div>
</div>
<div id="main">
  <div id="workspace">
  <div id="toolbar">
    <div class="tool-label">place</div>
    <div id="tool-btns" style="display:flex;flex-direction:column;align-items:center;gap:6px;"></div>
    <div class="tool-sep"></div>
    <div class="tool-label">select</div>
    <div class="entity-btn active" id="tool-select" title="Select / Move [S]">
      <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 2 L4 14 L7 11 L9 16 L11 15 L9 10 L13 10 Z" fill="#7c6af7"/></svg>
      <div class="kbd">S</div>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-label">grid</div>
    <div id="grid-toggle" class="tool-mini-btn" title="Grid snap [G]">GRID</div>
    <div class="tool-sep"></div>
    <div class="tool-label">rand size</div>
    <div id="rand-toggle" title="Random size on placement [R]">RAND</div>
    <div class="rand-inputs" id="rand-inputs" style="display:none">
      <label>min</label>
      <input id="rand-min" type="number" value="8" min="1" max="200" step="1"/>
      <label>max</label>
      <input id="rand-max" type="number" value="40" min="1" max="200" step="1"/>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-label">index</div>
    <div id="index-picker">
      <div id="index-picker-label">#sprite</div>
      <div id="index-picker-controls">
        <button class="idx-arrow" id="idx-prev">&lt;</button>
        <input id="index-picker-val" type="number" value="1" min="1" max="999"/>
        <button class="idx-arrow" id="idx-next">&gt;</button>
      </div>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-label">layer</div>
    <div class="tool-mini-btn" id="btn-front" title="Bring to front []]">FRONT</div>
    <div class="tool-mini-btn" id="btn-back" title="Send to back [[]">BACK</div>
    <div class="tool-sep"></div>
    <div class="tool-label">duplicate</div>
    <div class="tool-mini-btn" id="btn-duplicate" title="Duplicate [D]">DUPL</div>
    <div class="tool-sep"></div>
    <div class="tool-label">delete</div>
    <div class="entity-btn" id="btn-delete-selected" title="Delete selected (Del)">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 2 L16 16 M16 2 L2 16" stroke="#f38ba8" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div id="stentor-panel">
    <div id="stentor-panel-inner">
      <div id="stentor-panel-head">
        <span id="stentor-panel-head-label">Entity presets</span>
        <button id="stentor-panel-close" title="Close">x</button>
      </div>
      <div id="stentor-preset-list"></div>
      <button id="stentor-panel-save" title="Save selected entity as new preset">+ save selected as preset</button>
      <button id="stentor-panel-resave" title="Write all current presets to Entities folder">save preset library -&gt; Entities</button>
    </div>
  </div>
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  </div>
  <div id="props-panel"><h2>Properties</h2><div id="props-content"><p class="prop-empty">Click an entity on the canvas to edit its properties.</p></div></div>
</div>
<div id="modal-overlay">
